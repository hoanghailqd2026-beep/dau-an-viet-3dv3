  <!-- Hệ cột đình đôi -->
  <line x1="12" y1="23.5" x2="12" y2="28" stroke="#C9A15B" stroke-width="2" stroke-linecap="round" />
  <line x1="24" y1="23.5" x2="24" y2="28" stroke="#C9A15B" stroke-width="2" stroke-linecap="round" />

  <!-- Bậc thềm nền móng -->
  <line x1="8.5" y1="28.5" x2="27.5" y2="28.5" stroke="#C9A15B" stroke-width="2" stroke-linecap="round" />
</svg>
