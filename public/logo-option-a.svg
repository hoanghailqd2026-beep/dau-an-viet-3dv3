<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" width="36" height="36" fill="none">
  <!-- PHƯƠNG ÁN A: MÁI ĐAO CONG ĐÌNH/CHÙA TRUYỀN THỐNG VIỆT NAM -->
  <!-- Đơn sắc vàng đồng #C9A15B, nét liền 2px, không khung viền -->
