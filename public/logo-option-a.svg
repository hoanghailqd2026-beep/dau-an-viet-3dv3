  <!-- Mũi đao uốn cong hai đầu hồi -->
  <path d="M3 13.5C2.5 10.8 5 9.8 7 10.5" stroke="#C9A15B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M33 13.5C33.5 10.8 31 9.8 29 10.5" stroke="#C9A15B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Tầng ngói hạ / diềm mái âm dương -->
  <path d="M5 19.5C9.5 19 13.5 16.8 18 13.8C22.5 16.8 26.5 19 31 19.5" stroke="#C9A15B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

